@if (!loading) {
  @if (dataFound) {
    <main-page></main-page>
  } @else {
    <empty-page></empty-page>
  }
} @else {
  <div class="progress-container" role="status" aria-live="polite">
    <div class="loading-message">Initializing runs and tools...</div>
    <!-- TODO(go/progressbar-aria): Replace the aria-label with a better description, e.g. "Fetching user data" -->
    <md-linear-progress indeterminate aria-label="Loading"></md-linear-progress>
  </div>
}
