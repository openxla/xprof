@if (columnLabel) {
  <mat-form-field class="control" appearance="outline">
    <mat-label>{{columnLabel}}</mat-label>
    <mat-select (selectionChange)="updateFilter()" [(value)]="value">
      @for (option of options; track option) {
        <mat-option [value]="option" [title]="option">{{option}}</mat-option>
      }
    </mat-select>
  </mat-form-field>
}
