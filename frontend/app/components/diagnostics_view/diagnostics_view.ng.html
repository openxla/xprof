<ng-container *ngIf="showErrors && currentDiagnostics?.errors?.length">
  <div *ngFor="let error of currentDiagnostics.errors; let i = index; trackBy: trackByMsg" class="callout is-critical">
    <header>
      <span>Error</span>
      <button mat-icon-button (click)="dismissError(i)">
        <mat-icon>close</mat-icon>
      </button>
    </header>
    <ul class="callout-list">
      <li [innerHtml]="error"></li>
    </ul>
  </div>
</ng-container>
<ng-container *ngIf="showWarnings && currentDiagnostics?.warnings?.length">
  <div *ngFor="let warning of currentDiagnostics.warnings; let i = index; trackBy: trackByMsg" class="callout is-important">
    <header>
      <span>Warning</span>
      <button mat-icon-button (click)="dismissWarning(i)">
        <mat-icon>close</mat-icon>
      </button>
    </header>
    <ul class="callout-list">
      <li [innerHtml]="warning"></li>
    </ul>
  </div>
</ng-container>
<ng-container *ngIf="showInfo && currentDiagnostics?.info?.length">
  <div *ngFor="let info of currentDiagnostics.info; let i = index; trackBy: trackByMsg" class="callout is-helpful">
    <header>
      <span>Info</span>
      <button mat-icon-button (click)="dismissInfo(i)">
        <mat-icon>close</mat-icon>
      </button>
    </header>
    <ul class="callout-list">
      <li [innerHtml]="info"></li>
    </ul>
  </div>
</ng-container>
