<div class="mat-headline">Summary of input-pipeline analysis</div>
<div
  class="summary-conclusion description"
  [style.color]="summaryColor || null"
  [innerHTML]="inputConclusion"
></div>
@if (summaryNextstep) {
  <div
    class="summary-nextstep description"
    [innerHTML]="summaryNextstep"
  ></div>
}
