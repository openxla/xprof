<mat-toolbar class="profiler-toolbar">
  <button
      mat-icon-button
      aria-label="Menu icon"
      i18n-aria-label="A button to open the side menu."
      class="sidenav-toggle-button"
      (click)="isSideNavOpen = !isSideNavOpen">
    <mat-icon>menu</mat-icon>
  </button>
  <span>XProf</span>
  <span class="version-label" *ngIf="pluginVersion">
    v{{pluginVersion}}
  </span>
  <span class="toolbar-spacer"></span>
</mat-toolbar>

<!-- toolbar has a height of 64px, adding inline style to overwrite the fullscreen styles -->
<mat-sidenav-container fullscreen style="top:64px;">
  <mat-sidenav mode="side" [opened]="isNewNavEnabled ? true : isSideNavOpen" [style.width.px]="isNewNavEnabled ? (isSideNavOpen ? 240 : 64) : null">
    @if (isNewNavEnabled) {
      <rack-navigation-drawer [collapsed]="!isSideNavOpen">
        <rack-navigation-group label="Tools" [expanded]="true">
          @for (tag of availableTools; track tag) {
            <rack-navigation-item
              [icon]="getToolIcon(tag)"
              [label]="getToolLabel(tag)"
              [active]="currentTag === tag || (!currentTag && tag === 'overview_page')"
              (click)="selectTool(tag)">
              {{getToolLabel(tag)}}
            </rack-navigation-item>
          }
        </rack-navigation-group>
      </rack-navigation-drawer>
    }
    <sidenav [hidden]="isNewNavEnabled"></sidenav>
  </mat-sidenav>
  <mat-sidenav-content
    [class.new-nav-content]="isNewNavEnabled"
    [class.new-nav-expanded]="isNewNavEnabled && isSideNavOpen">
    <diagnostics-view [diagnostics]="diagnostics"></diagnostics-view>
    <div class="progress-container" *ngIf="loading">
      <div class="loading-message">{{loadingMessage}}</div>
      <!-- TODO(go/progressbar-aria): Replace the aria-label with a better description, e.g. "Fetching user data" -->
      <mat-progress-bar color="primary" mode="indeterminate" aria-label="Loading"></mat-progress-bar>
    </div>
    <div class="progress-container" *ngIf="!navigationReady">
      <div class="loading-message">Navigating. First-time session loads may take up to a few minutes.</div>
      <!-- TODO(go/progressbar-aria): Replace the aria-label with a better description, e.g. "Fetching user data" -->
      <mat-progress-bar color="primary" mode="indeterminate" aria-label="Loading"></mat-progress-bar>
    </div>
    <div [className]="(loading || !navigationReady) ? 'hidden-content' : 'full-height'">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
