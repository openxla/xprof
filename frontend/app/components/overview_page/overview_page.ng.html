<!--
The Overview Page is a view within the tf-profile-dashboard.
It is the first page that users would look at in order to understand
the overall performance of their TPU workloads. The page is divided into the left and right section:
Left section:
(1) Performance summary
(2) Run environment
Right section:
(1) Step-time graph for training / inference
-->

<div>
  <diagnostics-view [diagnostics]="diagnostics" />
  <div class="container">
    <div class="left-column">
      <performance-summary
        [isInference]="isInference"
        [generalAnalysis]="generalAnalysis"
        [inputPipelineAnalysis]="inputPipelineAnalysis"
        [inferenceLatencyData]="inferenceLatencyData"
        [sessionId]="sessionId"
        [disaggregatedServingLatencyData]="disaggregatedServingLatencyData"
        [baselineGeneralAnalysis]="baselineGeneralAnalysis"
        [baselineInputPipelineAnalysis]="baselineInputPipelineAnalysis"
        [baselineInferenceLatencyData]="baselineInferenceLatencyData"
        [baselineDisaggregatedServingLatencyData]="baselineDisaggregatedServingLatencyData"
        [class]="darkTheme() ? 'dark-theme' : ''" />
      <ng-content select="[normalizedAcceleratorPerformanceView]" />
      <run-environment-view [runEnvironment]="runEnvironment" [class]="darkTheme() ? 'dark-theme' : ''">
        <ng-content taskCount select="[taskCount]" />
        <ng-content jobInformation select="[jobInformation]" />
      </run-environment-view>
    </div>

    <div class="right-column">
      <ng-content select="[stepTimeGraphView]" />
      @if (hasStepTimeGraphData) {
        <step-time-graph
          stepTimeGraphView
          id="step-time-graph"
          [inputPipelineAnalysis]="inputPipelineAnalysis"
          [class]="darkTheme() ? 'dark-theme' : ''"
          (ready)="onChartReady()" />
      }
      @if (hasInferenceLatencyData) {
        <inference-latency-chart
          [inferenceLatencyData]="inferenceLatencyData"
          [class]="darkTheme() ? 'dark-theme' : ''"
          (ready)="onChartReady()" />
      }
      @if (enableSmartSuggestion) {
        <smart-suggestion-view
          [sessionId]="sessionId"
          [darkTheme]="darkTheme()" />
      }
      <ng-content select="[sblView]" />
      <ng-content select="[tfDataView]" />
      <ng-content select="[topology]" />
    </div>
  </div>
</div>
