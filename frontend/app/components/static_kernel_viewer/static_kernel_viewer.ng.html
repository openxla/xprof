<mat-sidenav-container class="static-kernel-viewer-container">
  <mat-sidenav
    mode="side"
    opened
    class="sidebar"
    [class.expanded]="isRailExpanded"
    [class.pinned]="isRailPinned"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
  >
    <!-- Collapsed Rail Bar -->
    <div class="collapsed-rail-bar" *ngIf="!isRailExpanded">
      <mat-icon class="rail-icon">memory</mat-icon>
      <span class="rail-badge" *ngIf="kernelList.length > 0">
        {{ filteredKernels.length }}
      </span>
      <button
        mat-icon-button
        class="rail-pin-btn"
        (click)="togglePin()"
        matTooltip="Expand panel"
        matTooltipPosition="after"
        aria-label="Expand panel"
      >
        <svg class="panel-icon" xmlns="http://www.w3.org/2000/svg" height="28px" viewBox="0 -960 960 960" width="28px" fill="currentColor">
          <path d="M300-640v320l160-160-160-160ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm440-80h120v-560H640v560Zm-80 0v-560H200v560h360Zm80 0h120-120Z"/>
        </svg>
      </button>
    </div>

    <!-- Expanded Rail Content -->
    <div class="sidebar-header" *ngIf="isRailExpanded">
      <div class="header-title">
        <mat-icon class="header-icon">memory</mat-icon>
        <span class="title-text">Pallas Primitives</span>
        <span class="count-badge" *ngIf="kernelList.length > 0">
          ({{ filteredKernels.length }})
        </span>
        <span class="spacer"></span>
        <button
          mat-icon-button
          class="pin-btn"
          [class.active]="isRailPinned"
          (click)="togglePin()"
          [matTooltip]="isRailPinned ? 'Collapse panel' : 'Expand panel'"
          matTooltipPosition="below"
          [attr.aria-label]="isRailPinned ? 'Collapse panel' : 'Expand panel'"
        >
          <svg class="panel-icon" xmlns="http://www.w3.org/2000/svg" height="28px" viewBox="0 -960 960 960" width="28px" fill="currentColor">
            <path d="M460-320v-320L300-480l160 160ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm440-80h120v-560H640v560Zm-80 0v-560H200v560h360Zm80 0h120-120Z"/>
          </svg>
        </button>
      </div>

      <div class="module-filter-box">
        <mat-form-field appearance="outline" class="module-field">
          <mat-label>JIT Module</mat-label>
          <mat-select
            [ngModel]="selectedHloModule"
            (selectionChange)="onHloModuleChange($event.value)"
            [disabled]="loadingKernels || hloModules.length === 0"
          >
            <mat-option value="All Modules">All Modules</mat-option>
            <mat-option *ngFor="let mod of hloModules" [value]="mod">
              {{ mod }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="filter-box">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-icon matPrefix class="search-icon">search</mat-icon>
          <input
            matInput
            placeholder="Search primitives..."
            [(ngModel)]="filterQuery"
            (input)="applyFilter()"
            autocomplete="off"
            aria-label="Search primitives"
          />
          <button
            *ngIf="filterQuery"
            mat-icon-button
            matSuffix
            (click)="clearFilter()"
            aria-label="Clear search"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>
      </div>
    </div>

    <div class="sidebar-content" *ngIf="isRailExpanded">
      <div *ngIf="loadingKernels" class="loading-state">
        <mat-spinner diameter="32"></mat-spinner>
        <span>Loading Pallas primitives...</span>
      </div>

      <div *ngIf="!loadingKernels && filteredKernels.length === 0" class="empty-state">
        <mat-icon class="empty-icon">info</mat-icon>
        <span>No matching Pallas primitives</span>
      </div>

      <mat-nav-list *ngIf="!loadingKernels && filteredKernels.length > 0" class="primitive-list">
        <a
          mat-list-item
          *ngFor="let kernel of filteredKernels"
          [class.active]="kernel === selectedKernel"
          (click)="onKernelChange(kernel)"
          [matTooltip]="kernel"
          [matTooltipPosition]="'after'"
          [matTooltipShowDelay]="400"
        >
          <mat-icon matListItemIcon class="primitive-icon">extension</mat-icon>
          <span matListItemTitle class="primitive-name">{{ kernel }}</span>
        </a>
      </mat-nav-list>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <trace-viewer-container
      [url]="url"
      [traceViewerModule]="traceViewerModule"
      [useTraceViewerV2]="true"
      (initializeWasm)="onInitializeWasm()"
    >
    </trace-viewer-container>
  </mat-sidenav-content>
</mat-sidenav-container>
