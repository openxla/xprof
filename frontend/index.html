<!doctype html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
  rel="stylesheet"
/>
<link
  href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&display=swap"
  rel="stylesheet"
/>
<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" rel="stylesheet">
  <meta charset="utf-8">
  <title>XProf</title>
  <base href="/" />

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="styles.css">
  <script src="zone.js"></script>
</head>
<body>
  <app></app>
  <link rel="stylesheet" href="https://www.gstatic.com/external_hosted/highlightjs/styles/googlecode.css">
  <link rel="stylesheet" href="https://www.gstatic.com/external_hosted/highlightjs/styles/atom-one-dark.css">
  <script>
    let bundleLoaded = false;
    function loadBundle() {
      if (bundleLoaded) return;
      bundleLoaded = true;
      const script = document.createElement('script');
      script.src = 'bundle.js';
      document.body.appendChild(script);
      return script;
    }

    function loadChart(domain) {
      const script = document.createElement('script');
      script.src = `https://${domain}/charts/loader.js`;
      document.body.appendChild(script);
      script.onload = () => {
        loadBundle();
      };
      return script;
    }

    const script = loadChart('www.gstatic.com');
    script.onerror = () => {
      script.onerror = null;
      if (script.parentNode) {
        document.body.removeChild(script);
      }

      if (!bundleLoaded) {
        const backupScript = loadChart('www.gstatic.cn');
        backupScript.onerror = () => {
          backupScript.onerror = null;
          if (backupScript.parentNode) {
            document.body.removeChild(backupScript);
          }
          loadBundle();
        };
      }
    };

    // Ensure Angular bundle boots within 2.5s even on offline/blocked networks.
    setTimeout(() => {
      loadBundle();
    }, 2500);
  </script>
</body>
</html>
