syntax = "proto3";

package tensorflow.profiler;

option optimize_for = LITE_RUNTIME;

// LINT.IfChange

message LloRegionProto {
  repeated LloRegionProto.RegionMember members = 1;
  string name = 2;
  int32 start_bundleno = 5;
  int32 limit_bundleno = 6;
  int32 ordinal = 7;
  message RegionMember {
    oneof value {
      LloInstructionProto instruction = 1;
      LloLoopProto loop = 2;
      LloPredicatedRegionProto predicated_region = 3;
      LloRegionProto sub_region = 4;
    }
  }
}

message StaticPerBundleUtilizationProto {
  StaticPerBundleUtilizationProto.RationalVectorProto mxu = 1;
  StaticPerBundleUtilizationProto.RationalVectorProto xlu = 2;
  StaticPerBundleUtilizationProto.RationalVectorProto vector_alu = 3;
  StaticPerBundleUtilizationProto.RationalVectorProto vector_eup = 4;
  StaticPerBundleUtilizationProto.RationalVectorProto vector_load = 5;
  StaticPerBundleUtilizationProto.RationalVectorProto vector_store = 6;
  StaticPerBundleUtilizationProto.RationalVectorProto scalar_alu = 7;
  repeated int32 vector_spill = 8;
  repeated int32 vector_fill = 9;
  message RationalVectorProto {
    repeated int32 numerator = 1;
    int32 denominator = 2;
  }
}

message LloAllocationProto {
  int32 space = 1;
  int64 size = 4;
  int32 ordinal = 5;
  int32 alignment_in_words = 7;
  int32 word_offset_within_allocation = 8;
  bool is_virtual = 9;
  bool is_spill = 10;
  bool is_scoped = 11;
  bool is_remote = 12;
  int32 fixed_kind = 13;
  int32 stack_trace_handle = 14;
}

message LloConstantProto {
  LloOpcodeProto opcode = 1;
  oneof value {
    bool bool_value = 2;
    int64 scalar_bits_u64 = 3;
    int64 vector_bits_u64 = 4;
    int32 vector_mask_packed_bits = 6;
    LloAllocationProto allocation = 5;
  }
}

message LloTpuDimensionsProto {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  optional int32 w = 4;
}

message LloTpuVersionProto {
  int32 version = 1;
  string variant = 2;
}

message LloTpuTopologyArgsProto {
  LloTpuVersionProto version = 1;
  string variant = 2;
  int32 platform_type = 3;
  string chip_config_name = 4;
  LloTpuDimensionsProto chips_per_host_bounds = 5;
  LloTpuDimensionsProto host_bounds = 6;
  bool twist = 8;
  bool enhanced_barrier_enabled = 9;
}

message LloTargetArgumentsProto {
  int64 replica_count = 3;
  int64 reserved_hbm_usage_bytes = 4;
  LloTpuTopologyArgsProto tpu_topology_args = 6;
}

message LloModuleProto {
  string hlo_instruction_name = 1;
  string hlo_module_name = 10;
  int64 hlo_module_id = 11;
  LloRegionProto top_region = 2;
  repeated LloConstantProto interned_constants = 8;
  repeated string interned_strings = 9;
  StaticPerBundleUtilizationProto static_utilization = 6;
  LloTargetArgumentsProto target_arguments = 7;
  LloSourceMapProto source_map = 12;
}

// Wire-compatible mirror of xprof.tpu.llo_debug.FrameProto. `path` indexes into
// LloSourceMapProto.strings.
message LloSourceFrameProto {
  int32 path = 1;
  int32 line_start = 2;
  int32 line_end = 3;
  int32 col_start = 4;
  int32 col_end = 5;
  int32 function_name = 6;
}

// Wire-compatible mirror of xprof.tpu.llo_debug.SourceInfoProto.
message LloSourceInfoProto {
  // Source frames, outer to inner order (inner-most is frames[last]).
  repeated LloSourceFrameProto frames = 1;
  // Index into LloSourceMapProto.strings for the Pallas primitive name.
  int32 primitive = 2;
  // JAX named scope stack (indices into strings), outer to inner order.
  repeated int32 scope_stack = 3;
  // LLO instruction ordinals associated with this source location.
  repeated int32 ordinals = 4;
}

// Wire-compatible mirror of xprof.tpu.llo_debug.SourceMapProto.
message LloSourceMapProto {
  repeated LloSourceInfoProto locations = 1;
  repeated string strings = 2;
}

// Wire-compatible mirror of tensorflow.profiler.XSpace so OSS/JAX environments
// without tensorflow installed can parse and construct XSpace files directly.
message LloXStatMetadataProto {
  int64 id = 1;
  string name = 2;
  string description = 3;
}

message LloXStatProto {
  int64 metadata_id = 1;
  oneof value {
    double double_value = 2;
    int64 uint64_value = 3;
    int64 int64_value = 4;
    string str_value = 5;
    bytes bytes_value = 6;
    int64 ref_value = 7;
  }
}

message LloXEventMetadataProto {
  int64 id = 1;
  string name = 2;
  bytes metadata = 3;
  string display_name = 4;
  repeated LloXStatProto stats = 5;
  repeated int64 child_id = 6;
}

message LloXEventProto {
  int64 metadata_id = 1;
  oneof data {
    int64 offset_ps = 2;
    int64 num_occurrences = 5;
  }
  int64 duration_ps = 3;
  repeated LloXStatProto stats = 4;
}

message LloXLineProto {
  int64 id = 1;
  string name = 2;
  int64 timestamp_ns = 3;
  repeated LloXEventProto events = 4;
  int64 duration_ps = 9;
  int64 display_id = 10;
  string display_name = 11;
}

message LloXPlaneProto {
  int64 id = 1;
  string name = 2;
  repeated LloXLineProto lines = 3;
  map<int64, LloXEventMetadataProto> event_metadata = 4;
  map<int64, LloXStatMetadataProto> stat_metadata = 5;
  repeated LloXStatProto stats = 6;
}

message LloXSpaceProto {
  repeated LloXPlaneProto planes = 1;
  repeated string errors = 2;
  repeated string warnings = 3;
  repeated string hostnames = 4;
}

enum RegisterTypeProto {
  REGISTER_TYPE_NONE = 0;
  REGISTER_TYPE_PREG = 1;
  REGISTER_TYPE_SREG = 2;
  REGISTER_TYPE_VMREG = 3;
  REGISTER_TYPE_VREG = 4;
  REGISTER_TYPE_RPREG = 5;
  REGISTER_TYPE_DREG = 6;
  REGISTER_TYPE_CBREG = 7;
}

enum PseudoKindProto {
  PSEUDO_KIND_NONE = 0;
  PSEUDO_KIND_TO_REMOVE = 1;
  PSEUDO_KIND_COPY_REGISTER = 2;
  PSEUDO_KIND_SPILL_TO_MEMORY = 3;
  PSEUDO_KIND_FILL_FROM_MEMORY = 4;
  PSEUDO_KIND_SPILL_TO_REGISTER = 5;
  PSEUDO_KIND_SPILL_TO_HBM = 6;
  PSEUDO_KIND_FILL_FROM_HBM = 7;
  PSEUDO_KIND_SPILL_TO_VIRTUAL = 8;
  PSEUDO_KIND_FILL_FROM_VIRTUAL = 9;
  PSEUDO_KIND_RESERVE_REGISTER = 10;
  PSEUDO_KIND_REMATERIALIZE = 11;
  PSEUDO_KIND_SPLIT_COPY = 12;
}

message LloInstructionProto {
  int32 ordinal = 1;
  LloOpcodeProto opcode = 2;
  repeated LloInstructionProto.LloOperand operands = 3;
  sint32 scheduled_bundleno = 4;
  sint32 register_id = 7;
  RegisterTypeProto register_type = 8;
  optional int32 annotation_handle = 9;
  oneof metadata {
    PseudoKindProto pseudo_kind = 29;
  }
  message LloOperand {
    oneof value {
      int32 constant_handle = 1;
      int32 instruction_ordinal = 2;
    }
  }
}

message LloLoopProto {
  LloRegionProto pre_header = 1;
  LloRegionProto header = 2;
  LloRegionProto header_branch = 3;
  LloRegionProto body = 4;
  LloRegionProto footer = 5;
  LloRegionProto footer_branch = 6;
  LloRegionProto exit = 7;
  LloLoopProto.LoopIndexSpaceProto index_space = 8;
  LloLoopProto.LloLoopKindProto kind = 10;
  message LoopIndexSpaceProto {
    int64 start = 1;
    int64 limit = 2;
    int64 step = 3;
  }
  enum LloLoopKindProto {
    LOOP_KIND_NONE = 0;
    LOOP_KIND_WHILE = 1;
    LOOP_KIND_DOWHILE = 2;
  }
}

message LloPredicatedRegionProto {
  LloRegionProto check_region = 1;
  LloRegionProto check_branch_region = 2;
  LloRegionProto predicated_region = 3;
  LloRegionProto fallthru_region = 4;
}

