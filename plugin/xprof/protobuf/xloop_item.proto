// XLoop Engine benchmark item.

syntax = "proto3";

package xprof.xloop;

// NOTE: deliberately not LITE_RUNTIME. The engine round-trips these messages
// through proto3 JSON (google.protobuf.json_format), which needs the full
// runtime's reflection support.

option cc_enable_arenas = true;

// Outcome of parsing, compiling or executing one piece of code.
enum CodeStatus {
  CODE_STATUS_UNSPECIFIED = 0;
  CODE_STATUS_COMPILE_ERROR = 1;
  CODE_STATUS_EXECUTE_ERROR = 2;
  CODE_STATUS_PARSE_SUCCESS = 3;
  CODE_STATUS_EXECUTE_SUCCESS = 4;
  // Not run: no accelerator became free before the lease timeout. The host
  // was busy. The same run can succeed later.
  CODE_STATUS_BUSY = 5;
}

// Framework the item is written against.
enum KernelType {
  KERNEL_TYPE_UNSPECIFIED = 0;
  KERNEL_TYPE_TORCH = 1;
  KERNEL_TYPE_JAX = 2;
}

// Auxiliary Python modules required to run the main kernel code.
//
// The engine materializes these to disk beside the kernel before importing
// it, which is how a kernel that spans several modules executes in an
// isolated worker.
message AuxiliaryModules {
  // Fully qualified Python module name -> source code of that module.
  map<string, string> modules = 1;
}

// One input-generation program, plus the tolerances that apply when comparing
// outputs produced from its inputs.
message InputGenerationConfig {
  string name = 1;

  // Source of a module defining `get_input_generator()` and, optionally,
  // `get_init_inputs()`.
  string input_generation_code = 2;

  // Absolute/relative tolerance for output comparison. Unset means defer to
  // the input-generation module's `get_atol()` / `get_rtol()`, and failing
  // that to the engine default of 1e-3.
  optional float atol = 3;
  optional float rtol = 4;

  AuxiliaryModules auxiliary_modules = 5;
}

// A hardware/compiler configuration the item can be executed under.
message ExecutionEnvironment {
  reserved 1;

  // Requested accelerator shapes, e.g. "2x2".
  repeated string slice_shapes = 2;

  // Compiler flags to apply, in `--flag=value` form. On a TPU VM these are
  // passed through LIBTPU_INIT_ARGS.
  repeated string xla_flags = 3;
}

// How the engine lays out and hands inputs to the compiled function.
enum InputLayout {
  // Inputs keep the layout they were generated with.
  INPUT_LAYOUT_DEFAULT = 0;

  // The compiler chooses the input layouts, and inputs are relaid out to match
  // once, outside the timed region.
  INPUT_LAYOUT_AUTO = 1;
}

// Per-item options for how inputs are passed to each implementation.
message InputOptions {
  // Names of arguments whose buffers may be donated to the computation.
  repeated string donate_argnames = 1;

  InputLayout layout = 2;
}

// The software and hardware a result was measured on. Recorded so that two
// results can be checked for comparability before their times are compared.
message RunEnvironment {
  string host_name = 1;
  string python_version = 2;
  string jax_version = 3;
  string jaxlib_version = 4;
  string libtpu_version = 5;
  string xprof_version = 6;

  // Backend platform as reported by JAX, e.g. "tpu" or "cpu".
  string platform = 7;

  // Runtime version string reported by the backend.
  string platform_version = 8;

  // Device kind as reported by JAX, e.g. "TPU v6 lite".
  string device_kind = 9;
  int32 device_count = 10;

  // Accelerator type of the host, e.g. "v6e-8", when the environment
  // provides it.
  string accelerator_type = 11;

  // Grid of device coordinates, e.g. "2x4x1".
  string topology = 12;

  // Compiler flags in effect for the run.
  repeated string xla_flags = 13;
}

// Measurements from a single sample (one set of generated inputs).
message SampleExecutionResult {
  reserved 9 to 11;

  float reference_execution_time_sec = 1;
  float custom_execution_time_sec = 2;
  float optimized_execution_time_sec = 3;
  map<string, float> reference_trace_matched_execution_times_sec = 4;
  map<string, float> custom_trace_matched_execution_times_sec = 5;
  map<string, float> optimized_trace_matched_execution_times_sec = 6;
  bool custom_outputs_match_reference = 7;
  bool optimized_outputs_match_reference = 8;

  // Per-device execution times, keyed by device id. Populated when the run
  // spans more than one device. The sample's `*_execution_time_sec` is then
  // the largest of these.
  map<string, float> reference_device_execution_times_sec = 12;
  map<string, float> custom_device_execution_times_sec = 13;
  map<string, float> optimized_device_execution_times_sec = 14;
}

// Everything observed for one input-generation config.
message ExecutionResult {
  reserved 3, 4, 6, 7, 8;

  CodeStatus execution_status = 1;
  string error_message = 2;

  repeated SampleExecutionResult sample_execution_results = 5;

  // Absolute path or file:// URL to the execution log.
  string execution_log_path = 9;

  // Captured contents of the execution log.
  string execution_log_content = 10;

  // Where each role's per-sample times came from, keyed by role name:
  // "trace" for durations read off the device plane of the emitted profile,
  // "wall_clock" for host-side measurements around the dispatch.
  //
  // Wall clock is a fallback. It includes host dispatch, which costs ~160us
  // on a v6e against ~2.5us of compute for a 1024-cube matmul, so it cannot
  // resolve a microbenchmark. A consumer comparing runs should check that
  // this says "trace" before trusting a speedup.
  map<string, string> timing_source = 11;

  // The software and hardware the times were measured on.
  RunEnvironment environment = 12;

  // The device that set each role's per-sample times most often, keyed by role
  // name. Set when `timing_source` is "trace". With one device, this is that
  // device.
  map<string, string> timing_device = 13;

  // The XLA module whose executions were timed, keyed by role name, without
  // its program id, e.g. "jit__matmul". Set when `timing_source` is "trace".
  // Other modules in the trace, such as input moves that run before a sharded
  // computation, are not counted as samples.
  map<string, string> timing_module = 14;

  // Why the trace did not give a full timing, keyed by role name: for example
  // a device left out because its execution count does not match the samples,
  // or a trace that cannot be read. Sentences are separated by "; ". Absent
  // when every device that ran the module was used.
  map<string, string> timing_notes = 15;

  // How far each role's outputs are from the reference outputs, in ULPs,
  // keyed by role name. Set only when the run asks for it (`xloop run
  // --xparity`). For information only: it does not change
  // `*_outputs_match_reference`.
  map<string, UlpReport> outputs_ulp = 16;

  // The chip that the chip broker leased for this config: its PCI slot, the
  // same in every process on the host. Empty when no broker was used.
  string leased_chip = 17;

  // The device node that pinned the worker to `leased_chip`, e.g.
  // "/dev/vfio/12". Empty when no broker was used, or for a synthetic chip.
  string leased_device_path = 18;
}

// How far a role's outputs are from the reference outputs, in units in the
// last place (ULPs) of the reference dtype, over every sample and output leaf
// of one input-generation config.
//
// For information only. Whether an output is correct comes from the item's
// `atol` and `rtol`, never from this report. NaN and infinite elements have no
// useful ULP distance: they are counted and left out of the distances.
message UlpReport {
  // "ok" if every leaf was measured, "partial" if only some were,
  // "not_measured" if none were, or "error".
  string status = 1;

  // Why a leaf was not measured, or why the report failed.
  string detail = 2;

  // Largest and median distance over the finite elements of the measured
  // leaves. Unset when no leaf was measured.
  optional int64 max_ulp = 3;
  optional double median_ulp = 4;

  // The ULP contract for `dtype`, the reference dtype of the leaf that has
  // `max_ulp`.
  int64 contract_ulp = 5;
  string dtype = 6;

  // No measured element is over its leaf's contract.
  optional bool within_contract = 7;

  // Every leaf was measured and is identical bit for bit.
  optional bool bit_identical = 8;

  // Leaves whose dtype differs from the reference dtype. A floating-point
  // leaf is still measured, in the reference dtype.
  int64 dtype_mismatch_count = 9;

  // NaN and infinite elements in the outputs and in the reference outputs.
  int64 nan_count = 10;
  int64 inf_count = 11;
  int64 reference_nan_count = 12;
  int64 reference_inf_count = 13;

  // Elements where the outputs and the reference do not have the same NaN or
  // the same infinity.
  int64 non_finite_mismatch_count = 14;

  // Where `max_ulp` occurs: the sample, the leaf in the flattened output
  // tree, and the index in that leaf. Set when `max_ulp` is not 0.
  int64 worst_sample = 15;
  int64 worst_leaf = 16;
  repeated int64 worst_index = 17;

  // The reference and output values at that element.
  double worst_reference_value = 18;
  double worst_output_value = 19;

  // Leaves compared over every sample, and how many were measured.
  int64 leaves_total = 20;
  int64 leaves_measured = 21;
}

// Aggregate across all input-generation configs.
message ExecutionReport {
  CodeStatus execution_status = 5;
  bool custom_outputs_match_reference = 4;
  bool optimized_outputs_match_reference = 9;
  float gmean_speedup_over_reference = 1;
  float gmean_speedup_over_optimized = 7;
  float gmean_speedup_optimized_over_reference = 8;
  map<string, float> reference_trace_matched_execution_times_sec = 2;
  map<string, float> custom_trace_matched_execution_times_sec = 3;
  map<string, float> optimized_trace_matched_execution_times_sec = 6;

  // Median of the per-sample reference-over-custom ratios, pooled over the
  // configs. This is the point estimate that matches `speedup_lower_bound` and
  // `speedup_upper_bound`, and the one that `verdict` uses. Unlike
  // `gmean_speedup_over_reference`, a few very slow samples move it little.
  float median_speedup_over_reference = 16;

  // Relative half-width of the band around 1.0 inside which
  // `median_speedup_over_reference` is indistinguishable from run-to-run
  // noise, e.g. 0.02 for +/-2%.
  float speedup_noise_band = 10;

  // "faster", "slower" or "no change". "faster" or "slower" needs
  // `median_speedup_over_reference` to be outside `speedup_noise_band`, and
  // the paired interval below to exclude 1.0.
  string verdict = 11;

  // Distribution-free 95% interval on the median of the per-sample
  // reference-over-custom ratios. It comes from the order statistics of the
  // ratios, so it is not symmetric and a few slow samples move it little.
  // Unset when there are fewer than 6 paired samples.
  float speedup_lower_bound = 12;
  float speedup_upper_bound = 13;

  // Why `verdict` is "no change" although the speedup is outside
  // `speedup_noise_band`. Empty otherwise.
  string verdict_note = 14;

  // The largest `UlpReport.max_ulp` over the configs, keyed by role name. Set
  // only for roles with a measured ULP report.
  map<string, int64> outputs_max_ulp = 15;
}

// A single benchmark: up to three implementations of the same computation,
// the programs that generate their inputs, and the results of running them.
message XLoopItem {
  reserved 6 to 22, 24 to 26, 28 to 31, 34 to 41;

  string id = 1;
  string name = 2;
  KernelType kernel_type = 3;

  // The baseline implementation, and the correctness oracle. This is the code
  // to be optimized.
  //
  // Each `*_code` field holds source text, not a path. The entry point is the
  // module's `get_model_identifier()`.
  string reference_code = 4;
  AuxiliaryModules reference_auxiliary_modules = 42;

  // The implementation under test, usually machine generated.
  string custom_code = 5;
  AuxiliaryModules custom_auxiliary_modules = 43;

  // A known-good optimized implementation, used for headroom analysis.
  string optimized_code = 23;
  AuxiliaryModules optimized_auxiliary_modules = 44;

  // Input-generation programs keyed by config name. An item is executed once
  // per config.
  map<string, InputGenerationConfig> input_generation_configs = 27;

  // Configurations to execute under. Each entry pairs compiler flags with
  // compatible accelerator shapes.
  repeated ExecutionEnvironment execution_environments = 47;

  // How inputs are passed to each implementation.
  InputOptions input_options = 48;

  // Per-input-generation-config results, keyed by config name.
  map<string, ExecutionResult> execution_results = 33;

  // Aggregate across all configs.
  ExecutionReport execution_report = 32;
}

// A batch of items, so a whole suite is one file.
message XLoopItems {
  repeated XLoopItem items = 1;
}
