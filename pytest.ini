[pytest]
# Scoped to the UI suite. The repo's other Python tests are colocated with
# sources and run under Bazel, not pytest.
testpaths = tests
pythonpath = .
# -n auto --dist loadgroup: the suite is E2E and dominated by browser
# wall-clock; loadgroup keeps xdist_group-marked SxS tests on one worker.
addopts = -n auto --dist loadgroup --strict-markers
markers =
    sweep: generic invariant sweep across tools/runs

