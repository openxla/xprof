[pytest]
# Scoped to the UI suite. The repo's other Python tests are colocated with
# sources and run under Bazel, not pytest.
testpaths = tests
pythonpath = . tests/ui
# -n auto: the suite is E2E and dominated by browser wall-clock; serial runs
# take minutes where parallel runs take seconds.
addopts = -n auto --strict-markers
markers =
    sweep: generic invariant sweep across tools/runs

